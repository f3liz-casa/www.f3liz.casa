<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>transit.f3liz.casa — 부산 버스, 실측이 자란다</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/style.css" />
<!--
  Naver 지도 키. referer 제한이라 Naver 콘솔의 Web 서비스 URL에
  https://transit.f3liz.casa 를 등록해야 지도가 뜹니다(키 자체는 공개 OK).
-->
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=xlyo3r9uwz"></script>

<div class="title-tag">
  부산 버스 <small>실측 GPS로, 파랑이 빨강으로 자란다 — transit.f3liz.casa</small>
</div>
<div id="map"></div>
<div class="legend">
  <div class="row"><span class="dot" style="background:#e83a34"></span>실측(확정)</div>
  <div class="row"><span class="dot" style="background:#f280b8"></span>차용(같은 정류장·타 노선 실측)</div>
  <div class="row"><span class="dot" style="background:#3372ff"></span>추측(미확정)</div>
  <div class="row"><span class="dot" style="background:#ffd91a"></span>버스 현재위치</div>
  <div class="row"><a href="/dashboard" style="color:#8b97a7;text-decoration:none">전체 노선 상태 →</a></div>
</div>
<div id="stat" style="position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(15,18,22,.82);color:#e6eaf0;font:12px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;padding:7px 11px;border-radius:8px"></div>

<!-- 전체 노선 빨강/파랑 오버레이(Julie/WebGPU, ROUTE_WGSL) + 버스 현재위치(노란 점). -->
<script src="/overlay-bridge.js"></script>
<script>
  const busan = new naver.maps.LatLng(35.16, 129.07);
  const map = new naver.maps.Map("map", { center: busan, zoom: 11, mapTypeControl: false });
  // overlay 의 world-meter 원점 = 부산 중심. 전체 노선 corrected 를 읽어 빨강/파랑으로.
  window.initJulieOverlay(map, { origin: busan });

  // 수집 진행(가벼운 /status.json 을 15초마다).
  async function tick() {
    try {
      const s = await (await fetch("/status.json", { cache: "no-store" })).json();
      document.getElementById("stat").textContent =
        `착수 ${s.touched}/${s.total || 302} · 평균 커버리지 ${(100 * s.avgCov).toFixed(1)}% · GPS ${(s.points || 0).toLocaleString()}점 · 오늘 ${((s.daily && s.daily.spent) || 0).toLocaleString()}/${(s.budget || 10000).toLocaleString()} req`;
    } catch (e) {}
  }
  tick();
  setInterval(tick, 15000);
</script>
